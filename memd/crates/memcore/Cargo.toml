[package]
name = "memcore"
version = "0.1.0"
edition = "2021"

[features]
default = ["local-fastembed"]
local-fastembed = ["dep:fastembed"]

[dependencies]
chrono = { version = ">=0.4.38, <0.5.0", features = ["serde"] }
fastembed = { version = ">=7.1.1, <8.0.0", default-features = false, features = ["ort-download-binaries-rustls-tls"], optional = true }
rand = ">=0.9.0, <0.10.0"
serde = { version = ">=1.0.219, <2.0.0", features = ["derive"] }
serde_json = ">=1.0.140, <2.0.0"

[[example]]
name = "embedding_similarity"
required-features = ["local-fastembed"]
