[package]
name = "memcore"
version = "0.1.0"
edition = "2021"

[features]
default = ["local-fastembed"]
local-fastembed = ["dep:fastembed", "dep:ort"]

[dependencies]
chrono = { version = ">=0.4.38, <0.5.0", features = ["serde"] }
fastembed = { version = ">=7.7.0, <8.0.0", default-features = false, features = ["ort-load-dynamic"], optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }
rand = ">=0.9.0, <0.10.0"
serde = { version = ">=1.0.219, <2.0.0", features = ["derive"] }
serde_json = ">=1.0.140, <2.0.0"
rusqlite = { version = ">=0.32.1, <0.34", features = ["bundled"] }
sqlite-vec = "=0.1.6"
